repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gate-check
        name: Gate Evidence Check
        entry: python scripts/gate_check.py --gate
        language: system
        types: [json]
        files: ^evidence/gate_[0-6]\.json$
        args: []
        pass_filenames: false
        always_run: true
        verbose: true