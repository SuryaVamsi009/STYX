# GitHub Copilot agent environment setup
# This file configures the development environment for Copilot agents

setup-steps:
  - name: Install system dependencies
    run: |
      sudo apt-get update && sudo apt-get install -y \
        python3.12 \
        python3.12-venv \
        git \
        curl

  - name: Create virtual environments
    run: |
      python3.12 -m venv .venv-openalgo
      python3.12 -m venv .venv-nautilus

  - name: Install uv
    run: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "$HOME/.local/bin" >> $GITHUB_PATH

  - name: Install OpenAlgo dependencies
    run: |
      .venv-openalgo/bin/pip install --upgrade pip
      .venv-openalgo/bin/pip install -r vendor/openalgo/requirements.txt openalgo

  - name: Install NautilusTrader dependencies
    run: |
      .venv-nautilus/bin/pip install --upgrade pip
      .venv-nautilus/bin/pip install -e "vendor/nautilus-fyers[nautilus,live,stream,dev]" pandas duckdb pytest

  - name: Install project dev dependencies (uv)
    run: |
      uv sync --locked

  - name: Install pre-commit hooks
    run: |
      .venv-nautilus/bin/pre-commit install

  - name: Verify setup
    run: |
      echo "=== OpenAlgo env ==="
      .venv-openalgo/bin/python -c "import openalgo; print(openalgo.__version__)"
      echo "=== Nautilus env ==="
      .venv-nautilus/bin/python -c "import nautilus_trader; print(nautilus_trader.__version__)"
      echo "=== Project tests ==="
      .venv-nautilus/bin/pytest tests/ -v --tb=short