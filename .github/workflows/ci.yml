name: STYX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up vendor/openalgo
        run: |
          git clone https://github.com/marketcalls/openalgo.git vendor/openalgo
          cd vendor/openalgo
          git checkout a1b9e32506bce21403a8614dddeed0ab61fd519a

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy bridge/ research/ scripts/
        continue-on-error: true

      - name: Tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: uv run pytest --cov=bridge --cov=research --cov=scripts --cov-report=term-missing

  gate-check:
    name: Gate Evidence Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Validate gate evidence files
        run: |
          for gate in 0 1 2 3 4 5 6; do
            if [ -f "evidence/gate_${gate}.json" ]; then
              uv run python scripts/gate_check.py --gate "${gate}"
            fi
          done

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --only-verified

  status-current:
    name: Status Current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check STATUS.md is current
        run: uv run python scripts/status.py --check